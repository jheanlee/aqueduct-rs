[package]
name = "aqueduct-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
dotenv = "0.15.0"
nanoid = "0.4.0"
rustls = "0.23.32"
sea-orm = "1.1.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "io-util", "time"] }
tokio-rustls = "0.26.3"
