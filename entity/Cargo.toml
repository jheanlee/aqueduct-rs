[package]
name = "aqueduct-rs-entity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "entity"
path = "src/lib.rs"

[dependencies]
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-ipnetwork"] }
serde = { version = "1.0.229", features = ["derive"] }