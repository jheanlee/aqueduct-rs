[package]
name = "aqueduct-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
aqueduct-rs-entity = { path = "../entity" }
chrono = "0.4.43"

clap = { version = "4.5.61", features = ["derive"] }
dotenv = "0.15.0"
log = "0.4.29"
nanoid = "0.4.0"
openssl = "0.10.76"
rustls = "0.23.37"
sea-orm = "2.0.0-rc.37"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socket2 = "0.6.3"
tokio = { version = "1.51.0", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "io-util", "time"] }
tokio-rustls = "0.26.4"
tokio-util = "0.7.18"

[target.'cfg(target_os = "macos")'.dependencies]
oslog = "0.2.0"

[target.'cfg(target_os = "linux")'.dependencies]
syslog = "7.0.0"
