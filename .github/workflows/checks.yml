name: Checks

on:
    push:
        branches: [ "master" ]
    pull_request:
        branches: [ "master" ]

permissions:
    contents: read

jobs:
    webui:
        name: WebUI checks
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: webui

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: 24.x
                    cache: npm
                    cache-dependency-path: webui/package-lock.json

            -   name: Install dependencies
                run: npm ci

            -   name: Check formatting
                run: npx prettier --check .

            -   name: Lint
                run: npm run lint

    rust:
        name: Rust checks
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Setup Rust
                uses: dtolnay/rust-toolchain@stable
                with:
                    toolchain: 1.97.0
                    components: rustfmt, clippy

            -   name: Check formatting
                run: cargo fmt --all -- --check

#           clippy would fail to build due to missing webui files
#            -   name: Lint
#                run: cargo clippy --all-targets --all-features -- -D warnings
